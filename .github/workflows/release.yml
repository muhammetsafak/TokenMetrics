name: Release

# Pushing a version tag (v1.2.3, v0.1.0-rc.1) builds the app on native runners
# for Windows, macOS and Linux and publishes the archives as a GitHub Release.
# A tag with a pre-release suffix (anything after a "-") is published as a
# pre-release. Binaries are not code signed.
on:
  push:
    tags: ['v*']

# Least privilege: build jobs only read. The publish job raises it to write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v2.17.1

jobs:
  prepare:
    name: validate tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a semantic version (vMAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            # Ubuntu 24.04 ships webkit2gtk 4.1 only.
            build_tags: "-tags webkit2_41"
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      ARCHIVE: tokenmetrics-${{ github.ref_name }}-${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@"${WAILS_VERSION}"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go test
        run: go test ${{ matrix.build_tags }} ./...

      - name: Wails build
        # -s: the frontend was already installed and built above from the lockfile.
        # The tag is embedded as main.version.
        run: >
          wails build -s -clean -trimpath
          -platform "${{ matrix.platform }}"
          ${{ matrix.build_tags }}
          -ldflags "-X main.version=${TAG}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/tokenmetrics.exe -DestinationPath "$env:ARCHIVE.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find build/bin -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::no .app bundle in build/bin"
            exit 1
          fi
          # wails build already applies an ad-hoc signature (no identity, no
          # notarization); fail here if the universal bundle's signature is broken.
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$ARCHIVE.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C build/bin -czf "$ARCHIVE.tar.gz" tokenmetrics

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: Extract release notes
        # The release notes are the CHANGELOG.md section of this version.
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' src/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum -- * > SHA256SUMS.txt

      - name: Publish GitHub Release
        working-directory: dist
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of a failed publish: replace the assets.
            gh release upload "$TAG" ./* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" ./* --verify-tag --title "$TAG" --notes-file ../release-notes.md "${flags[@]}"
          fi
